  /api/v1/notificacoes/destinos:
    post:
      tags: [Notificacoes]
      operationId: CadastrarDestinoNotificacao
      summary: Cadastra um destino de webhook; o segredo de assinatura aparece só nesta resposta.
      description: |
        Perfis autorizados: **Cliente** (destinos dele, que recebem só os pedidos dele) e **Admin**
        (destinos globais, que recebem todos os pedidos e são geridos por qualquer Admin; quem tem
        os dois perfis cadastra como Admin). OperadorLogistica: 403 (REQ-18).

        A URL precisa ser absoluta, `https`, sem usuário e senha, e o host precisa resolver só
        para endereços públicos (`NOTIFICACAO_DESTINO_ENDERECO_PROIBIDO`). Até 5 destinos por
        Cliente e 5 globais (`NOTIFICACAO_DESTINO_LIMITE`, 409). O `segredo` (`whsec_` + Base64)
        assina os webhooks no formato do Standard Webhooks e não aparece em nenhuma outra resposta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarDestinoRequestDTO'
            example:
              url: https://loja.exemplo.com/oms/webhooks
      responses:
        '201':
          description: Destino cadastrado, com o segredo.
          headers:
            Location:
              description: URL do recurso criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinoCadastradoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
    get:
      tags: [Notificacoes]
      operationId: ListarDestinosNotificacao
      summary: Lista os destinos do usuário, sem o segredo.
      description: |
        O Cliente vê os próprios destinos; o Admin, os globais. OperadorLogistica: 403 (REQ-18).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Destinos do usuário, por ordem de cadastro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DestinoNotificacaoResponseDTO'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/notificacoes/destinos/{id}:
    delete:
      tags: [Notificacoes]
      operationId: RemoverDestinoNotificacao
      summary: Remove um destino; as entregas pendentes dele são descartadas.
      description: |
        Destino de outro Cliente, ou global para um Cliente: 404 (REQ-18).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do destino.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Destino removido.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/notificacoes/destinos/{id}/reativacao:
    post:
      tags: [Notificacoes]
      operationId: ReativarDestinoNotificacao
      summary: Reativa um destino desativado e zera as falhas.
      description: |
        Idempotente: um destino já ativo volta sem mudança. As entregas esgotadas não são
        reenviadas; o destino recebe os avisos novos (REQ-18).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do destino.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Destino ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinoNotificacaoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/notificacoes/destinos/{id}/entregas:
    get:
      tags: [Notificacoes]
      operationId: ListarEntregasNotificacao
      summary: Lista as últimas entregas do destino, da mais nova para a mais antiga.
      description: |
        Sem a URL completa nem o corpo da resposta do receptor (REQ-18).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do destino.
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          description: Quantas entregas, de 1 a 200.
          schema:
            type: integer
            format: int32
            default: 50
      responses:
        '200':
          description: Entregas do destino.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntregaNotificacaoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/notificacoes/eventos:
    get:
      tags: [Notificacoes]
      operationId: EventosNotificacao
      summary: Abre a conexão de eventos (SSE) com os avisos dos pedidos que o usuário pode consultar.
      description: |
        Resposta `text/event-stream` (REQ-18, `specs/018-notificacao-status/contracts/api-notificacoes.md`).
        O Cliente recebe só os próprios pedidos; Admin e OperadorLogistica, todos. Eventos:
        `conectado` (o primeiro, sem `Last-Event-ID`), `pedido.status-alterado`,
        `pedido.estorno-confirmado`, `sincronizacao-necessaria` e `sinal` (a cada 30 s sem aviso).
        Com `Last-Event-ID`, reenvia até 500 avisos perdidos. A conexão termina no `exp` do token.
        Mais de 3 conexões do usuário na mesma instância: 429 (`NOTIFICACAO_SSE_LIMITE_CONEXOES`).
      security:
        - bearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          description: O `id` do último evento recebido, para a reconexão.
          schema:
            type: string
        - name: pedidoId
          in: query
          description: Só os avisos deste pedido; de outro Cliente ou inexistente, 404.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stream de eventos (`text/event-stream`).
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '429':
          description: Limite de conexões de eventos atingido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/ErroInterno'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por POST /api/v1/auth/login.

  parameters:
    ChaveIdempotencia:
      name: X-Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo cliente para identificar a tentativa de criação.
      schema:
        type: string
        format: uuid
    IdPedido:
      name: id
      in: path
      required: true
      description: Identificador do pedido.
      schema:
        type: string
        format: uuid
    IdProduto:
      name: id
      in: path
      required: true
      description: Identificador do produto.
      schema:
        type: string
        format: uuid

  responses:
    ErroLimiteRequisicoes:
      description: Limite de requisições excedido. Igual em todos os casos, sem revelar os limites nem se a conta existe (REQ-23).
      headers:
        Retry-After:
          description: Segundos a esperar antes de tentar de novo.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NegocioProblemDetails'
          example:
            type: about:blank
            title: Muitas requisições.
            status: 429
            detail: Aguarde o tempo indicado no cabeçalho Retry-After e tente de novo.
            instance: /api/v1/auth/login
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: LIMITE_REQUISICOES_EXCEDIDO
    ErroValidacao:
      description: Dados de entrada inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidacaoProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: Um ou mais campos são inválidos.
            status: 400
            instance: /api/v1/pedidos
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            erros:
              itens[0].quantidade: [A quantidade deve estar entre 1 e 999.]
              X-Idempotency-Key: [O cabeçalho X-Idempotency-Key é obrigatório e deve ser um UUID.]
    ErroNaoAutenticado:
      description: Token ausente, inválido ou expirado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErroSemPermissao:
      description: Usuário autenticado sem permissão para a operação.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErroNaoEncontrado:
      description: Recurso não encontrado (ou não visível para o usuário).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErroConflito:
      description: Conflito com o estado atual do recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NegocioProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.10
            title: Transição de status não permitida.
            status: 409
            detail: O pedido está Despachado e não pode ir para Pendente.
            instance: /api/v1/pedidos/0f8fad5b-d9cb-469f-a165-70867728950e/status
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: PEDIDO_TRANSICAO_INVALIDA
    ErroRegraNegocio:
      description: Requisição bem formada, mas rejeitada por regra de negócio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NegocioProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc4918#section-11.2
            title: Produto inexistente.
            status: 422
            detail: O produto 7c9e6679-7425-40de-944b-e07fc1f90ae7 não foi encontrado.
            instance: /api/v1/pedidos
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: PRODUTO_INEXISTENTE
    ErroInterno:
      description: Erro inesperado. Não expõe detalhes internos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  examples:
