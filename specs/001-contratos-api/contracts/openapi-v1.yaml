  /api/v1/admin/dlq/{consumidor}/reenvios:
    post:
      tags: [Administracao]
      operationId: RegistrarReenvioDlq
      summary: Pede o reenvio das mensagens da DLQ de um consumidor; o processo de workers o executa.
      description: |
        Perfil autorizado: **Admin**. Cliente e OperadorLogistica: 403 (REQ-14).

        A rota só registra o pedido, com o Admin autenticado como autor, e responde 202; ela
        não fala com o broker. O processo de workers executa os pedidos pendentes, um de cada
        vez, e grava o resultado, consultado em `GET /api/v1/admin/dlq/reenvios/{id}`. Todos os
        campos do filtro são opcionais; corpo `{}` seleciona todas as mensagens que o limite de
        reenvios permitir.
      security:
        - bearerAuth: []
      parameters:
        - name: consumidor
          in: path
          required: true
          description: Consumidor dono da DLQ (estoque, pagamento ou entrega).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarReenvioDlqRequestDTO'
            example:
              tipoEvento: pedido.criado
              trechoMotivo: Timeout
      responses:
        '202':
          description: Pedido de reenvio registrado, pendente de execução.
          headers:
            Location:
              description: URL da consulta do pedido de reenvio.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoReenvioDlqResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/admin/dlq/reenvios/{id}:
    get:
      tags: [Administracao]
      operationId: ObterReenvioDlq
      summary: Consulta um pedido de reenvio da DLQ, com a situação e as contagens.
      description: |
        Perfil autorizado: **Admin**. Cliente e OperadorLogistica: 403 (REQ-14).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador do pedido de reenvio.
          schema:
