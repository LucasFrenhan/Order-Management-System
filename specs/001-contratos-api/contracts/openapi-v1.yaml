  schemas:
    PerfilUsuario:
      type: string
      enum: [Cliente, Admin, OperadorLogistica]

    StatusPedido:
      type: string
      enum: [Pendente, Processando, ProntoParaEnvio, Despachado, Cancelado, PagamentoRejeitado]

    RegistrarUsuarioRequestDTO:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 256
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Ao menos uma letra maiúscula, uma minúscula e um dígito.

    UsuarioResponseDTO:
      type: object
      required: [id, nome, email, perfis]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        perfis:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PerfilUsuario'

    LoginRequestDTO:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    LoginResponseDTO:
      type: object
      required: [tokenAcesso, tipoToken, expiraEm, perfis, tokenRenovacao, tokenRenovacaoExpiraEm]
      properties:
        tokenAcesso:
          type: string
        tipoToken:
          type: string
          description: Sempre "Bearer".
        expiraEm:
          type: string
          format: date-time
          description: Instante de expiração (UTC). A validade é configurável, 15 minutos por padrão.
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/PerfilUsuario'
        tokenRenovacao:
          type: string
          description: Token opaco, de uso único, para POST /api/v1/auth/renovacao.
        tokenRenovacaoExpiraEm:
          type: string
          format: date-time
          description: Instante de expiração (UTC) do token de renovação.

    RenovacaoRequestDTO:
      type: object
      required: [tokenRenovacao]
      properties:
        tokenRenovacao:
          type: string
          maxLength: 128

    LogoutRequestDTO:
      type: object
      required: [tokenRenovacao]
      properties:
        tokenRenovacao:
          type: string
          maxLength: 128

    RecuperacaoSenhaRequestDTO:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 256

    ConfirmacaoEmailRequestDTO:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128

    ReenvioConfirmacaoRequestDTO:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 256

    TrocaSenhaRequestDTO:
      type: object
      required: [senhaAtual, novaSenha]
      properties:
        senhaAtual:
          type: string
          format: password
        novaSenha:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Ao menos uma letra maiúscula, uma minúscula e um dígito.

    RedefinicaoSenhaRequestDTO:
      type: object
      required: [token, novaSenha]
      properties:
        token:
          type: string
          maxLength: 128
        novaSenha:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Ao menos uma letra maiúscula, uma minúscula e um dígito.

    ItemPedidoDTO:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId:
          type: string
          format: uuid
        quantidade:
          type: integer
          format: int32
          minimum: 1
          maximum: 999

    CriarPedidoRequestDTO:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          maxItems: 50
          description: Cada produtoId pode aparecer no máximo uma vez.
          items:
            $ref: '#/components/schemas/ItemPedidoDTO'

    ItemPedidoResponseDTO:
      type: object
      required: [produtoId, nomeProduto, quantidade, precoUnitario, subtotal]
      properties:
        produtoId:
          type: string
          format: uuid
        nomeProduto:
          type: string
        quantidade:
          type: integer
          format: int32
        precoUnitario:
          type: number
          format: decimal
          description: Duas casas decimais.
        subtotal:
          type: number
          format: decimal
          description: Duas casas decimais.

    PedidoResponseDTO:
      type: object
      required: [id, numero, clienteId, status, itens, valorTotal, moeda, criadoEm, atualizadoEm]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          pattern: '^PED-\d{8}-\d{6}$'
        clienteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusPedido'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoResponseDTO'
        valorTotal:
          type: number
          format: decimal
          description: Duas casas decimais.
        moeda:
          type: string
          description: Sempre "BRL".
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
        historico:
          type: array
          description: |
            Mudanças de status em ordem cronológica, sem o autor (REQ-11). Sempre presente nas
            respostas da API; pode vir vazia na repetição idempotente de um pedido criado antes
            do REQ-11.
          items:
            $ref: '#/components/schemas/HistoricoStatusPedidoResponseDTO'
        entrega:
          description: Ordem de entrega do pedido; null enquanto ela não existe (REQ-11).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/EntregaPedidoResponseDTO'

    HistoricoStatusPedidoResponseDTO:
      type: object
      required: [statusNovo, ocorridoEm]
      properties:
        statusAnterior:
          description: Null na criação do pedido.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StatusPedido'
        statusNovo:
          $ref: '#/components/schemas/StatusPedido'
        ocorridoEm:
          type: string
          format: date-time
        motivo:
          type: ['null', string]

    EntregaPedidoResponseDTO:
      type: object
      required: [criadoEm]
      description: Transportadora, código de rastreio e data de despacho ficam null até o despacho.
      properties:
        transportadora:
          type: ['null', string]
        codigoRastreio:
          type: ['null', string]
        despachadoEm:
          type: ['null', string]
          format: date-time
        criadoEm:
          type: string
          format: date-time
          description: Instante de criação da ordem de entrega.
        canceladaEm:
          type: ['null', string]
          format: date-time
          description: Instante do cancelamento da ordem, junto com o pedido; null se não cancelada (REQ-13).

    ResumoPedidoResponseDTO:
      type: object
      description: Um pedido na listagem (REQ-21), sem itens, histórico nem entrega.
      required: [id, numero, clienteId, status, valorTotal, moeda, quantidadeItens, criadoEm, atualizadoEm]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          pattern: '^PED-\d{8}-\d{6}$'
        clienteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusPedido'
        valorTotal:
          type: number
          format: decimal
          description: Duas casas decimais.
        moeda:
          type: string
          description: Sempre "BRL".
        quantidadeItens:
          type: integer
          format: int32
          description: Linhas de item (produtos distintos), não a soma das quantidades.
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time

    PaginaPedidosResponseDTO:
      type: object
      description: Uma página da listagem (REQ-21); sem total nem número de página.
      required: [itens, tamanho, proximo, anterior]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ResumoPedidoResponseDTO'
        tamanho:
          type: integer
          format: int32
        proximo:
          type: ['null', string]
          description: Cursor da próxima página; null na última.
        anterior:
          type: ['null', string]
          description: Cursor da página anterior; null na primeira.

    ProdutoResponseDTO:
      type: object
      description: |
        Um produto do catálogo (REQ-22). `quantidadeEstoque`, `ativo`, `criadoEm` e `atualizadoEm`
        só vêm para Admin e OperadorLogistica; na resposta ao Cliente, são omitidos.
      required: [id, sku, nome, descricao, preco, moeda, disponivel]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        nome:
          type: string
        descricao:
          type: ['null', string]
        preco:
          type: number
          format: decimal
          description: Duas casas decimais.
        moeda:
          type: string
          description: Sempre "BRL".
        disponivel:
          type: boolean
          description: Há ao menos uma unidade em estoque.
        quantidadeEstoque:
          type: ['null', integer]
          format: int32
        ativo:
          type: ['null', boolean]
        criadoEm:
          type: ['null', string]
          format: date-time
        atualizadoEm:
          type: ['null', string]
          format: date-time

    PaginaProdutosResponseDTO:
      type: object
      description: Uma página da listagem de produtos (REQ-22), como a de pedidos.
      required: [itens, tamanho, proximo, anterior]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ProdutoResponseDTO'
        tamanho:
          type: integer
          format: int32
        proximo:
          type: ['null', string]
          description: Cursor da próxima página; null na última.
        anterior:
          type: ['null', string]
          description: Cursor da página anterior; null na primeira.

    CadastrarProdutoRequestDTO:
      type: object
      required: [sku, nome]
      properties:
        sku:
          type: string
          maxLength: 50
        nome:
          type: string
          maxLength: 200
        descricao:
          type: ['null', string]
          maxLength: 1000
        preco:
          type: number
          format: decimal
          description: Maior que zero, até 999999.99, com no máximo duas casas decimais.
        estoqueInicial:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000000

    AlterarProdutoRequestDTO:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
          maxLength: 200
        descricao:
          type: ['null', string]
          maxLength: 1000
        preco:
          type: number
          format: decimal
          description: Maior que zero, até 999999.99, com no máximo duas casas decimais.

    AjustarEstoqueRequestDTO:
      type: object
      required: [motivo]
      properties:
        variacao:
          type: integer
          format: int32
          minimum: -1000000
          maximum: 1000000
          description: Diferente de zero; positiva repõe, negativa dá baixa.
        motivo:
          type: string
          maxLength: 200

    AtualizarStatusPedidoRequestDTO:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/StatusPedido'
        motivo:
          type: [string, 'null']
          maxLength: 500
          description: Obrigatório quando status = Cancelado.

    RegistrarRastreioRequestDTO:
      type: object
      required: [transportadora, codigoRastreio]
      description: Ambos obrigatórios, sem contar os espaços nas pontas (REQ-11).
      properties:
        transportadora:
          type: string
          maxLength: 100
        codigoRastreio:
          type: string
          maxLength: 50

    SituacaoReenvioDlq:
      type: string
      enum: [Pendente, EmExecucao, Concluido, Falhou]

    CadastrarDestinoRequestDTO:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048

    DestinoNotificacaoResponseDTO:
      type: object
      required: [id, url, global, ativo, falhasSeguidas, criadoEm]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        global:
          type: boolean
        ativo:
          type: boolean
        motivoDesativacao:
          type: ['null', string]
        desativadoEm:
          type: ['null', string]
          format: date-time
        falhasSeguidas:
          type: integer
          format: int32
        criadoEm:
          type: string
          format: date-time

    DestinoCadastradoResponseDTO:
      type: object
      required: [segredo, id, url, global, ativo, falhasSeguidas, criadoEm]
      properties:
        segredo:
          type: string
          description: '`whsec_` + Base64 de 32 bytes; aparece só no cadastro.'
        id:
          type: string
          format: uuid
        url:
          type: string
        global:
          type: boolean
        ativo:
          type: boolean
        motivoDesativacao:
          type: ['null', string]
        desativadoEm:
          type: ['null', string]
          format: date-time
        falhasSeguidas:
          type: integer
          format: int32
        criadoEm:
          type: string
          format: date-time

    SituacaoEntrega:
      type: string
      enum: [Pendente, Entregue, Esgotada, Descartada]

    EntregaNotificacaoResponseDTO:
      type: object
      required: [idNotificacao, tipo, pedidoId, situacao, tentativas, criadaEm]
      properties:
        idNotificacao:
          type: string
          format: uuid
        tipo:
          type: string
        pedidoId:
          type: string
          format: uuid
        situacao:
          $ref: '#/components/schemas/SituacaoEntrega'
        tentativas:
          type: integer
          format: int32
        ultimoCodigoHttp:
          type: ['null', integer]
          format: int32
        ultimoErro:
          type: ['null', string]
        criadaEm:
          type: string
          format: date-time
        proximaTentativaEm:
          type: ['null', string]
          format: date-time
        finalizadaEm:
          type: ['null', string]
          format: date-time

    RegistrarReenvioDlqRequestDTO:
      type: object
      description: Filtro do reenvio (REQ-14). Campos opcionais e combináveis; os textos são medidos depois de aparar.
      properties:
        tipoEvento:
          type: ['null', string]
        falhouDe:
          type: ['null', string]
          format: date-time
        falhouAte:
          type: ['null', string]
          format: date-time
          description: Igual ou posterior a falhouDe.
        trechoMotivo:
          type: ['null', string]

    PedidoReenvioDlqResponseDTO:
      type: object
      required: [id, consumidor, situacao, autorId, registradoEm, reenviadas, bloqueadasPeloLimite, foraDoFiltro]
      properties:
        id:
          type: string
          format: uuid
        consumidor:
          type: string
        situacao:
          $ref: '#/components/schemas/SituacaoReenvioDlq'
        autorId:
          type: string
          format: uuid
        tipoEvento:
          type: ['null', string]
        falhouDe:
          type: ['null', string]
          format: date-time
        falhouAte:
          type: ['null', string]
          format: date-time
        trechoMotivo:
          type: ['null', string]
        registradoEm:
          type: string
          format: date-time
        iniciadoEm:
          type: ['null', string]
          format: date-time
        concluidoEm:
          type: ['null', string]
          format: date-time
        reenviadas:
          type: integer
          format: int32
        bloqueadasPeloLimite:
          type: integer
          format: int32
        foraDoFiltro:
          type: integer
          format: int32
        motivoFalha:
          type: ['null', string]

    ProblemDetails:
      type: object
      required: [type, title, status, instance, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: [string, 'null']
        instance:
          type: string
        traceId:
          type: string

    ValidacaoProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [erros]
          properties:
            erros:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    NegocioProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              description: Código estável do erro (ver catálogo em data-model.md).
