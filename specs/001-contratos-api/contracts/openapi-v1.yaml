  /api/v1/produtos/{id}/ativacao:
    post:
      tags: [Produtos]
      operationId: AtivarProduto
      summary: Reativa o produto; repetir não muda nada (somente Admin).
      description: Perfis autorizados - **Admin** (REQ-22).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdProduto'
      responses:
        '200':
          description: Produto ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
