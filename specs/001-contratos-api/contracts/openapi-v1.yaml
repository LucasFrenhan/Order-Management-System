openapi: 3.1.1
info:
  title: Order Management System - API de Pedidos
  version: v1
  description: |
    Contrato público v1 da API do OMS (REQ-01). Fonte da verdade aprovada; a API gerada
    deve permanecer conforme este documento (teste de conformidade, FR-024).

    Mudanças permitidas na v1: apenas adições opcionais. Remoções, renomeações e mudanças
    de tipo ou obrigatoriedade exigem /api/v2 (Princípio II).

    Todos os erros seguem RFC 7807 (application/problem+json).

    Evoluções compatíveis: REQ-11 acrescentou `historico` e `entrega` à resposta do pedido e
    a operação `PATCH /api/v1/pedidos/{id}/rastreio`. REQ-24 acrescentou as rotas do ciclo de
    autenticação e os campos `tokenRenovacao` e `tokenRenovacaoExpiraEm` à resposta do login, e
    mudou o padrão da validade do token de acesso de 60 para 15 minutos: leia `expiraEm`.
servers:
  - url: /
tags:
  - name: Autenticacao
    description: Registro e login de usuários.
  - name: Pedidos
    description: Criação, consulta e atualização de status de pedidos.
  - name: Administracao
    description: Operação da mensageria, só para Admin (REQ-14).
  - name: Notificacoes
    description: Destinos de webhook e eventos em tempo real das mudanças de status (REQ-18).

paths:
  /api/v1/auth/register:
    post:
      tags: [Autenticacao]
      operationId: RegistrarUsuario
      summary: Registra um novo usuário com o perfil Cliente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequestDTO'
            example:
              nome: Maria Silva
              email: maria.silva@exemplo.com.br
              senha: SenhaForte123
      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDTO'
              example:
                id: 3f2b8c1e-6a4d-4e2f-9b1a-0c7d5e8f9a10
                nome: Maria Silva
                email: maria.silva@exemplo.com.br
                perfis: [Cliente]
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/login:
    post:
      tags: [Autenticacao]
      operationId: AutenticarUsuario
      summary: Autentica com e-mail e senha e emite um token de acesso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
            example:
              email: maria.silva@exemplo.com.br
              senha: SenhaForte123
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
              example:
                tokenAcesso: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                tipoToken: Bearer
                expiraEm: '2026-10-21T18:00:00Z'
                perfis: [Cliente]
                tokenRenovacao: 8sJq0rS1aVb3nXyZk7LmP2tQw9EeR4uIo6DfG5hJc1A
                tokenRenovacaoExpiraEm: '2026-11-04T17:45:00Z'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          description: Credenciais inválidas. Mensagem genérica que não revela se o e-mail existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Credenciais inválidas.
                status: 401
                detail: E-mail ou senha incorretos.
                instance: /api/v1/auth/login
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/renovacao:
    post:
      tags: [Autenticacao]
      operationId: RenovarSessao
      summary: Troca um token de renovação por um novo par de tokens.
      description: |
        Cada token de renovação serve uma só vez. Apresentar de novo um token já usado encerra toda
        a sessão, inclusive o token mais recente dela: renove uma vez de cada vez (REQ-24).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenovacaoRequestDTO'
      responses:
        '200':
          description: Sessão renovada, com o mesmo corpo do login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          description: Token inválido, expirado, reutilizado ou de sessão encerrada, sem indicar o motivo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Sessão inválida.
                status: 401
                detail: Faça login novamente.
                instance: /api/v1/auth/renovacao
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/logout:
    post:
      tags: [Autenticacao]
      operationId: EncerrarSessao
      summary: Encerra a sessão do token de renovação informado.
      description: |
        Não exige token de acesso, para funcionar também com ele expirado. O token de acesso ainda
        válido continua funcionando até expirar (REQ-24).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestDTO'
      responses:
        '204':
          description: Encerrada, ou o token já não valia. Repetir não é erro e não revela nada.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/recuperacao-senha:
    post:
      tags: [Autenticacao]
      operationId: PedirRecuperacaoSenha
      summary: Pede um e-mail de recuperação de senha.
      description: A resposta é a mesma com ou sem conta, e o e-mail só é enviado se a conta existir (REQ-24).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacaoSenhaRequestDTO'
      responses:
        '202':
          description: Pedido recebido, em qualquer caso.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/redefinicao-senha:
    post:
      tags: [Autenticacao]
      operationId: RedefinirSenha
      summary: Define uma senha nova com o token recebido por e-mail.
      description: Encerra todas as sessões da conta e zera o bloqueio por erros de senha (REQ-24).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinicaoSenhaRequestDTO'
      responses:
        '204':
          description: Senha redefinida.
        '400':
          description: Dados de entrada inválidos, ou token inválido, expirado ou já usado.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidacaoProblemDetails'
                  - $ref: '#/components/schemas/NegocioProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Token inválido.
                status: 400
                detail: O token é inválido ou expirou. Peça uma nova recuperação.
                instance: /api/v1/auth/redefinicao-senha
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: TOKEN_INVALIDO
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/confirmacao-email:
    post:
      tags: [Autenticacao]
      operationId: ConfirmarEmail
      summary: Confirma o e-mail da conta com o token recebido por e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacaoEmailRequestDTO'
      responses:
        '204':
          description: E-mail confirmado.
        '400':
          description: Dados de entrada inválidos, ou token inválido, expirado ou já usado.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidacaoProblemDetails'
                  - $ref: '#/components/schemas/NegocioProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: Token inválido.
                status: 400
                detail: O token é inválido ou expirou. Peça um novo e-mail.
                instance: /api/v1/auth/confirmacao-email
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: TOKEN_INVALIDO
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/confirmacao-email/reenvio:
    post:
      tags: [Autenticacao]
      operationId: ReenviarConfirmacaoEmail
      summary: Pede um novo e-mail de confirmação.
      description: A resposta é a mesma em qualquer caso, e só uma conta não confirmada recebe o e-mail (REQ-24).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenvioConfirmacaoRequestDTO'
      responses:
        '202':
          description: Pedido recebido, em qualquer caso.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '429':
          $ref: '#/components/responses/ErroLimiteRequisicoes'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/troca-senha:
    post:
      tags: [Autenticacao]
      operationId: TrocarSenha
      summary: Troca a senha da pessoa conectada e encerra todas as sessões da conta.
      description: |
        Perfis autorizados: todos. Uma senha atual errada conta para o bloqueio de conta, e a resposta
        continua a mesma com a conta bloqueada. O token de acesso em uso vale até expirar (REQ-24).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrocaSenhaRequestDTO'
      responses:
        '204':
          description: Senha trocada.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos:
    get:
      tags: [Pedidos]
      operationId: ListarPedidos
      summary: Lista os pedidos do escopo do usuário, dos mais recentes para os mais antigos.
      description: |
        Perfis autorizados: **Cliente** (somente pedidos próprios), **Admin**, **OperadorLogistica**.
        O filtro `clienteId` é exclusivo da operação: o Cliente que o informa recebe 403 (REQ-21).

        Paginação por cursor: a resposta traz `proximo` e `anterior` (ou `null`); para navegar,
        repita a consulta com os mesmos filtros e `cursor` igual a um deles. O cursor é opaco e
        vale só para o mesmo usuário e os mesmos filtros; fora disso, a resposta é 400 e a
        navegação recomeça da primeira página. Não há total nem número de página.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Um ou mais status; repita o parâmetro para mais de um.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StatusPedido'
        - name: criadoDe
          in: query
          description: Início (inclusivo) do período de criação, com fuso.
          schema:
            type: string
            format: date-time
        - name: criadoAte
          in: query
          description: Fim (inclusivo) do período de criação, com fuso.
          schema:
            type: string
            format: date-time
        - name: atualizadoDe
          in: query
          description: Início (inclusivo) do período de última alteração, com fuso.
          schema:
            type: string
            format: date-time
        - name: atualizadoAte
          in: query
          description: Fim (inclusivo) do período de última alteração, com fuso.
          schema:
            type: string
            format: date-time
        - name: clienteId
          in: query
          description: Somente Admin e OperadorLogistica.
          schema:
            type: string
            format: uuid
        - name: tamanho
          in: query
          description: Pedidos por página, de 1 a 100.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: O `proximo` ou o `anterior` de uma resposta anterior.
          schema:
            type: string
      responses:
        '200':
          description: Página de pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPedidosResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'

    post:
      tags: [Pedidos]
      operationId: CriarPedido
      summary: Cria um pedido para o Cliente autenticado (idempotente por X-Idempotency-Key).
      description: |
        Perfis autorizados: **Cliente**.

        Idempotência: a chave vale por usuário por no mínimo 24 horas.
        - Mesma chave e mesmo conteúdo: devolve 201 com o pedido originalmente criado.
        - Mesma chave e conteúdo diferente: 409 `IDEMPOTENCIA_CONTEUDO_DIVERGENTE`.
        - Mesma chave com requisição ainda em andamento: 409 `IDEMPOTENCIA_EM_PROCESSAMENTO`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoRequestDTO'
            example:
              itens:
                - produtoId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  quantidade: 2
                - produtoId: 9b2f1a3c-1d4e-4f5a-8b6c-7d8e9f0a1b2c
                  quantidade: 1
      responses:
        '201':
          description: Pedido criado (ou devolvido, em caso de repetição idempotente).
          headers:
            Location:
              description: URL do pedido criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
              examples:
                pedidoPendente:
                  $ref: '#/components/examples/PedidoPendente'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '422':
          $ref: '#/components/responses/ErroRegraNegocio'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      operationId: ObterPedido
      summary: Consulta um pedido pelo identificador.
      description: |
        Perfis autorizados: **Cliente** (somente pedidos próprios), **Admin**, **OperadorLogistica**.
        Um Cliente que consulta pedido de outro usuário recebe 404.

        A resposta 200 traz o `ETag` (forte) da versão do pedido; com `If-None-Match` igual, a
        resposta é 304, sem corpo (REQ-18). A autorização vem antes: o 404 não muda.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
        - name: If-None-Match
          in: header
          description: O `ETag` de uma consulta anterior.
          schema:
            type: string
      responses:
        '200':
          description: Pedido encontrado.
          headers:
            ETag:
              description: Versão do pedido; muda a cada alteração que aparece na resposta.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
              examples:
                pedidoPendente:
                  $ref: '#/components/examples/PedidoPendente'
        '304':
          description: O pedido não mudou desde o `ETag` informado; sem corpo.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos/{id}/status:
    patch:
      tags: [Pedidos]
      operationId: AtualizarStatusPedido
      summary: Altera o status de um pedido conforme as transições permitidas.
      description: |
        | De | Para | Perfis |
        |----|------|--------|
        | Pendente | Processando | Admin, OperadorLogistica |
        | Processando | ProntoParaEnvio | Admin, OperadorLogistica |
        | ProntoParaEnvio | Despachado | Admin, OperadorLogistica |
        | Pendente, Processando, ProntoParaEnvio | Cancelado | Admin, OperadorLogistica |
        | Pendente | Cancelado | Cliente (dono do pedido) |

        Outras transições: 409 `PEDIDO_TRANSICAO_INVALIDA`. `PagamentoRejeitado` não é aceito
        nesta operação (400). Cliente em pedido de outro usuário: 404. Cliente em transição
        diferente de Pendente→Cancelado: 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarStatusPedidoRequestDTO'
            example:
              status: Cancelado
              motivo: Cliente desistiu da compra.
      responses:
        '200':
          description: Status atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
              examples:
                pedidoCancelado:
                  $ref: '#/components/examples/PedidoCancelado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos/{id}/rastreio:
    patch:
      tags: [Pedidos]
      operationId: RegistrarRastreioPedido
      summary: Registra a transportadora e o código de rastreio e despacha o pedido (ou corrige o rastreio).
      description: |
        Perfis autorizados: **Admin**, **OperadorLogistica**. Cliente: 403 (REQ-11).

        | Status atual | Resultado |
        |--------------|-----------|
        | ProntoParaEnvio | Ordem de entrega criada se faltar; transportadora, código e data de despacho gravados; pedido em Despachado, com a entrada "Pedido despachado." no histórico |
        | Despachado, dados iguais | Nada muda |
        | Despachado, dados diferentes | Transportadora e código corrigidos; status, data de despacho e histórico mantidos |
        | Pendente, Processando, Cancelado, PagamentoRejeitado | 409 `PEDIDO_TRANSICAO_INVALIDA` |

        Os espaços nas pontas são removidos. O mesmo código na mesma transportadora, em outro
        pedido e sem diferenciar maiúsculas de minúsculas, responde 409
        `PEDIDO_RASTREIO_DUPLICADO`. A transição ProntoParaEnvio → Despachado pela rota de status
        continua permitida, sem rastreio.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarRastreioRequestDTO'
            example:
              transportadora: Correios
              codigoRastreio: BR123456789BR
      responses:
        '200':
          description: Pedido despachado, rastreio corrigido ou sem mudança.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '409':
          description: Status que não permite rastreio, ou código de rastreio já usado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NegocioProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Código de rastreio já usado.
                status: 409
                detail: Outro pedido já usa este código de rastreio nesta transportadora.
                instance: /api/v1/pedidos/0f8fad5b-d9cb-469f-a165-70867728950e/rastreio
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
                codigo: PEDIDO_RASTREIO_DUPLICADO
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/produtos:
    get:
      tags: [Produtos]
      operationId: ListarProdutos
      summary: Lista os produtos pelo nome, com busca em português; o Cliente vê só os ativos.
      description: |
        Perfis autorizados: **Cliente**, **OperadorLogistica** e **Admin** (REQ-22). O Cliente vê só
        os produtos ativos, sem `quantidadeEstoque`, `ativo` e datas; a operação vê todos. O filtro
        `situacao` é exclusivo da operação: o Cliente que o informa recebe 403.

        A busca usa o Full-Text Search em português do Brasil: por palavras, sem diferenciar
        acentos e maiúsculas, com plural e singular e pelo começo da palavra; com várias palavras,
        só os produtos que têm todas. Um produto novo ou alterado pode levar até 10 s para entrar
        na busca. A ordem é sempre pelo nome e pelo SKU. Paginação por cursor, como em
        `GET /api/v1/pedidos`.
      security:
        - bearerAuth: []
      parameters:
        - name: busca
          in: query
          description: Palavras do nome, do SKU ou da descrição, em português (de 2 a 100 caracteres, até 10 palavras).
          schema:
            type: string
        - name: situacao
          in: query
          description: 'Somente Admin e OperadorLogistica: Ativos, Inativos ou Todos (padrão).'
          schema:
            type: string
            enum: [Ativos, Inativos, Todos]
        - name: tamanho
          in: query
          description: Produtos por página, de 1 a 100.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: O `proximo` ou o `anterior` de uma resposta anterior.
          schema:
            type: string
      responses:
        '200':
          description: Página de produtos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProdutosResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Produtos]
      operationId: CadastrarProduto
      summary: Cadastra um produto ativo (somente Admin).
      description: |
        Perfis autorizados: **Admin** (REQ-22). O SKU é único sem diferenciar maiúsculas e não muda
        depois do cadastro; repetido, 409 `PRODUTO_SKU_DUPLICADO`. O preço é maior que zero, até
        999999.99, com duas casas.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastrarProdutoRequestDTO'
      responses:
        '201':
          description: Produto cadastrado.
          headers:
            Location:
              description: URL do produto cadastrado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/produtos/{id}:
    get:
      tags: [Produtos]
      operationId: ObterProduto
      summary: Consulta um produto; para o Cliente, um inativo responde como inexistente.
      description: Perfis autorizados como na listagem (REQ-22).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdProduto'
      responses:
        '200':
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Produtos]
      operationId: AlterarProduto
      summary: Altera nome, descrição e preço; o preço novo vale só para pedidos novos (somente Admin).
      description: |
        Perfis autorizados: **Admin** (REQ-22). Os pedidos já criados mantêm os preços. Com o produto
        alterado por outra operação, a alteração é reavaliada até 3 vezes; esgotadas, 409
        `PRODUTO_ALTERADO_POR_OUTRA_OPERACAO`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdProduto'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarProdutoRequestDTO'
      responses:
        '200':
          description: Produto alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/produtos/{id}/ajustes-estoque:
    post:
      tags: [Produtos]
      operationId: AjustarEstoqueProduto
      summary: Soma uma variação ao estoque, com motivo, sem perder unidades reservadas ao mesmo tempo (somente Admin).
      description: |
        Perfis autorizados: **Admin** (REQ-22). A variação é somada ao estoque atual no momento da
        gravação, numa instrução só: reservas ao mesmo tempo não perdem nem criam unidades. Estoque
        final negativo: 422 `ESTOQUE_INSUFICIENTE`; acima de 1000000000: 422 `ESTOQUE_ACIMA_DO_LIMITE`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdProduto'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjustarEstoqueRequestDTO'
      responses:
        '200':
          description: Estoque ajustado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '422':
          $ref: '#/components/responses/ErroRegraNegocio'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/produtos/{id}/desativacao:
    post:
      tags: [Produtos]
      operationId: DesativarProduto
      summary: Desativa o produto sem apagá-lo; repetir não muda nada (somente Admin).
      description: Perfis autorizados - **Admin** (REQ-22). O produto some para o Cliente e não pode mais ser pedido.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdProduto'
      responses:
        '200':
          description: Produto inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponseDTO'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
