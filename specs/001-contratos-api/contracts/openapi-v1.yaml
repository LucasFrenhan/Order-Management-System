openapi: 3.1.1
info:
  title: Order Management System - API de Pedidos
  version: v1
  description: |
    Contrato público v1 da API do OMS (REQ-01). Fonte da verdade aprovada; a API gerada
    deve permanecer conforme este documento (teste de conformidade, FR-024).

    Mudanças permitidas na v1: apenas adições opcionais. Remoções, renomeações e mudanças
    de tipo ou obrigatoriedade exigem /api/v2 (Princípio II).

    Todos os erros seguem RFC 7807 (application/problem+json).

    Evoluções compatíveis: REQ-11 acrescentou `historico` e `entrega` à resposta do pedido.
servers:
  - url: /
tags:
  - name: Autenticacao
    description: Registro e login de usuários.
  - name: Pedidos
    description: Criação, consulta e atualização de status de pedidos.

paths:
  /api/v1/auth/register:
    post:
      tags: [Autenticacao]
      operationId: RegistrarUsuario
      summary: Registra um novo usuário com o perfil Cliente.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarUsuarioRequestDTO'
            example:
              nome: Maria Silva
              email: maria.silva@exemplo.com.br
              senha: SenhaForte123
      responses:
        '201':
          description: Usuário criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDTO'
              example:
                id: 3f2b8c1e-6a4d-4e2f-9b1a-0c7d5e8f9a10
                nome: Maria Silva
                email: maria.silva@exemplo.com.br
                perfis: [Cliente]
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/auth/login:
    post:
      tags: [Autenticacao]
      operationId: AutenticarUsuario
      summary: Autentica com e-mail e senha e emite um token de acesso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
            example:
              email: maria.silva@exemplo.com.br
              senha: SenhaForte123
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDTO'
              example:
                tokenAcesso: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                tipoToken: Bearer
                expiraEm: '2026-10-21T18:00:00Z'
                perfis: [Cliente]
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          description: Credenciais inválidas. Mensagem genérica que não revela se o e-mail existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Credenciais inválidas.
                status: 401
                detail: E-mail ou senha incorretos.
                instance: /api/v1/auth/login
                traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos:
    post:
      tags: [Pedidos]
      operationId: CriarPedido
      summary: Cria um pedido para o Cliente autenticado (idempotente por X-Idempotency-Key).
      description: |
        Perfis autorizados: **Cliente**.

        Idempotência: a chave vale por usuário por no mínimo 24 horas.
        - Mesma chave e mesmo conteúdo: devolve 201 com o pedido originalmente criado.
        - Mesma chave e conteúdo diferente: 409 `IDEMPOTENCIA_CONTEUDO_DIVERGENTE`.
        - Mesma chave com requisição ainda em andamento: 409 `IDEMPOTENCIA_EM_PROCESSAMENTO`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoRequestDTO'
            example:
              itens:
                - produtoId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  quantidade: 2
                - produtoId: 9b2f1a3c-1d4e-4f5a-8b6c-7d8e9f0a1b2c
                  quantidade: 1
      responses:
        '201':
          description: Pedido criado (ou devolvido, em caso de repetição idempotente).
          headers:
            Location:
              description: URL do pedido criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
              examples:
                pedidoPendente:
                  $ref: '#/components/examples/PedidoPendente'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '422':
          $ref: '#/components/responses/ErroRegraNegocio'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      operationId: ObterPedido
      summary: Consulta um pedido pelo identificador.
      description: |
        Perfis autorizados: **Cliente** (somente pedidos próprios), **Admin**, **OperadorLogistica**.
        Um Cliente que consulta pedido de outro usuário recebe 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
              examples:
                pedidoPendente:
                  $ref: '#/components/examples/PedidoPendente'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /api/v1/pedidos/{id}/status:
    patch:
      tags: [Pedidos]
      operationId: AtualizarStatusPedido
      summary: Altera o status de um pedido conforme as transições permitidas.
      description: |
        | De | Para | Perfis |
        |----|------|--------|
        | Pendente | Processando | Admin, OperadorLogistica |
        | Processando | ProntoParaEnvio | Admin, OperadorLogistica |
        | ProntoParaEnvio | Despachado | Admin, OperadorLogistica |
        | Pendente, Processando, ProntoParaEnvio | Cancelado | Admin, OperadorLogistica |
        | Pendente | Cancelado | Cliente (dono do pedido) |

        Outras transições: 409 `PEDIDO_TRANSICAO_INVALIDA`. `PagamentoRejeitado` não é aceito
        nesta operação (400). Cliente em pedido de outro usuário: 404. Cliente em transição
        diferente de Pendente→Cancelado: 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarStatusPedidoRequestDTO'
            example:
              status: Cancelado
              motivo: Cliente desistiu da compra.
      responses:
        '200':
          description: Status atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponseDTO'
              examples:
                pedidoCancelado:
                  $ref: '#/components/examples/PedidoCancelado'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroSemPermissao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '409':
          $ref: '#/components/responses/ErroConflito'
        '500':
          $ref: '#/components/responses/ErroInterno'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por POST /api/v1/auth/login.

  parameters:
    ChaveIdempotencia:
      name: X-Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo cliente para identificar a tentativa de criação.
      schema:
        type: string
        format: uuid
    IdPedido:
      name: id
      in: path
      required: true
      description: Identificador do pedido.
      schema:
        type: string
        format: uuid

  responses:
    ErroValidacao:
      description: Dados de entrada inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidacaoProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: Um ou mais campos são inválidos.
            status: 400
            instance: /api/v1/pedidos
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            erros:
              itens[0].quantidade: [A quantidade deve estar entre 1 e 999.]
              X-Idempotency-Key: [O cabeçalho X-Idempotency-Key é obrigatório e deve ser um UUID.]
    ErroNaoAutenticado:
      description: Token ausente, inválido ou expirado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErroSemPermissao:
      description: Usuário autenticado sem permissão para a operação.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErroNaoEncontrado:
      description: Recurso não encontrado (ou não visível para o usuário).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ErroConflito:
      description: Conflito com o estado atual do recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NegocioProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.10
            title: Transição de status não permitida.
            status: 409
            detail: O pedido está Despachado e não pode ir para Pendente.
            instance: /api/v1/pedidos/0f8fad5b-d9cb-469f-a165-70867728950e/status
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: PEDIDO_TRANSICAO_INVALIDA
    ErroRegraNegocio:
      description: Requisição bem formada, mas rejeitada por regra de negócio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NegocioProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc4918#section-11.2
            title: Produto inexistente.
            status: 422
            detail: O produto 7c9e6679-7425-40de-944b-e07fc1f90ae7 não foi encontrado.
            instance: /api/v1/pedidos
            traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
            codigo: PRODUTO_INEXISTENTE
    ErroInterno:
      description: Erro inesperado. Não expõe detalhes internos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  examples:
    PedidoPendente:
      value:
        id: 0f8fad5b-d9cb-469f-a165-70867728950e
        numero: PED-20261021-000123
        clienteId: 3f2b8c1e-6a4d-4e2f-9b1a-0c7d5e8f9a10
        status: Pendente
        itens:
          - produtoId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            nomeProduto: Teclado Mecânico
            quantidade: 2
            precoUnitario: 349.90
            subtotal: 699.80
          - produtoId: 9b2f1a3c-1d4e-4f5a-8b6c-7d8e9f0a1b2c
            nomeProduto: Mouse sem fio
            quantidade: 1
            precoUnitario: 129.90
            subtotal: 129.90
        valorTotal: 829.70
        moeda: BRL
        criadoEm: '2026-10-21T15:30:00Z'
        atualizadoEm: '2026-10-21T15:30:00Z'
        historico:
          - statusAnterior: null
            statusNovo: Pendente
            ocorridoEm: '2026-10-21T15:30:00Z'
            motivo: null
        entrega: null
    PedidoCancelado:
      value:
        id: 0f8fad5b-d9cb-469f-a165-70867728950e
        numero: PED-20261021-000123
        clienteId: 3f2b8c1e-6a4d-4e2f-9b1a-0c7d5e8f9a10
        status: Cancelado
        itens:
          - produtoId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            nomeProduto: Teclado Mecânico
            quantidade: 2
            precoUnitario: 349.90
            subtotal: 699.80
          - produtoId: 9b2f1a3c-1d4e-4f5a-8b6c-7d8e9f0a1b2c
            nomeProduto: Mouse sem fio
            quantidade: 1
            precoUnitario: 129.90
            subtotal: 129.90
        valorTotal: 829.70
        moeda: BRL
        criadoEm: '2026-10-21T15:30:00Z'
        atualizadoEm: '2026-10-21T16:05:00Z'
        historico:
          - statusAnterior: null
            statusNovo: Pendente
            ocorridoEm: '2026-10-21T15:30:00Z'
            motivo: null
          - statusAnterior: Pendente
            statusNovo: Cancelado
            ocorridoEm: '2026-10-21T16:05:00Z'
            motivo: Cliente desistiu da compra.
        entrega: null

  schemas:
    PerfilUsuario:
      type: string
      enum: [Cliente, Admin, OperadorLogistica]

    StatusPedido:
      type: string
      enum: [Pendente, Processando, ProntoParaEnvio, Despachado, Cancelado, PagamentoRejeitado]

    RegistrarUsuarioRequestDTO:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 256
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Ao menos uma letra maiúscula, uma minúscula e um dígito.

    UsuarioResponseDTO:
      type: object
      required: [id, nome, email, perfis]
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        perfis:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PerfilUsuario'

    LoginRequestDTO:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password

    LoginResponseDTO:
      type: object
      required: [tokenAcesso, tipoToken, expiraEm, perfis]
      properties:
        tokenAcesso:
          type: string
        tipoToken:
          type: string
          description: Sempre "Bearer".
        expiraEm:
          type: string
          format: date-time
          description: Instante de expiração (UTC), 60 minutos após a emissão.
        perfis:
          type: array
          items:
            $ref: '#/components/schemas/PerfilUsuario'

    ItemPedidoDTO:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId:
          type: string
          format: uuid
        quantidade:
          type: integer
          format: int32
          minimum: 1
          maximum: 999

    CriarPedidoRequestDTO:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          maxItems: 50
          description: Cada produtoId pode aparecer no máximo uma vez.
          items:
            $ref: '#/components/schemas/ItemPedidoDTO'

    ItemPedidoResponseDTO:
      type: object
      required: [produtoId, nomeProduto, quantidade, precoUnitario, subtotal]
      properties:
        produtoId:
          type: string
          format: uuid
        nomeProduto:
          type: string
        quantidade:
          type: integer
          format: int32
        precoUnitario:
          type: number
          format: decimal
          description: Duas casas decimais.
        subtotal:
          type: number
          format: decimal
          description: Duas casas decimais.

    PedidoResponseDTO:
      type: object
      required: [id, numero, clienteId, status, itens, valorTotal, moeda, criadoEm, atualizadoEm]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          pattern: '^PED-\d{8}-\d{6}$'
        clienteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusPedido'
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoResponseDTO'
        valorTotal:
          type: number
          format: decimal
          description: Duas casas decimais.
        moeda:
          type: string
          description: Sempre "BRL".
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
        historico:
          type: array
          description: |
            Mudanças de status em ordem cronológica, sem o autor (REQ-11). Sempre presente nas
            respostas da API; pode vir vazia na repetição idempotente de um pedido criado antes
            do REQ-11.
          items:
            $ref: '#/components/schemas/HistoricoStatusPedidoResponseDTO'
        entrega:
          description: Ordem de entrega do pedido; null enquanto ela não existe (REQ-11).
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/EntregaPedidoResponseDTO'

    HistoricoStatusPedidoResponseDTO:
      type: object
      required: [statusNovo, ocorridoEm]
      properties:
        statusAnterior:
          description: Null na criação do pedido.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/StatusPedido'
        statusNovo:
          $ref: '#/components/schemas/StatusPedido'
        ocorridoEm:
          type: string
          format: date-time
        motivo:
          type: ['null', string]

    EntregaPedidoResponseDTO:
      type: object
      required: [criadoEm]
      description: Transportadora, código de rastreio e data de despacho ficam null até o despacho.
      properties:
        transportadora:
          type: ['null', string]
        codigoRastreio:
          type: ['null', string]
        despachadoEm:
          type: ['null', string]
          format: date-time
        criadoEm:
          type: string
          format: date-time
          description: Instante de criação da ordem de entrega.

    AtualizarStatusPedidoRequestDTO:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/StatusPedido'
        motivo:
          type: [string, 'null']
          maxLength: 500
          description: Obrigatório quando status = Cancelado.

    ProblemDetails:
      type: object
      required: [type, title, status, instance, traceId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: [string, 'null']
        instance:
          type: string
        traceId:
          type: string

    ValidacaoProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [erros]
          properties:
            erros:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    NegocioProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [codigo]
          properties:
            codigo:
              type: string
              description: Código estável do erro (ver catálogo em data-model.md).
