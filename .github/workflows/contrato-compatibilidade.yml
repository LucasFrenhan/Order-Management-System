# Bloqueia mudanças incompatíveis no contrato v1 (Princípio II; SC-006, FR-023).
# Compara o contrato do PR com o da branch de destino usando o oasdiff.
name: Compatibilidade do contrato

on:
  pull_request:
    paths:
      - "specs/**/contracts/*.yaml"

permissions:
  contents: read

env:
  CONTRATO: specs/001-contratos-api/contracts/openapi-v1.yaml

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Obter contrato da branch de destino
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:${CONTRATO}" > contrato-base.yaml 2>/dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${CONTRATO} ainda não existe em ${{ github.base_ref }}; nada a comparar."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar mudanças incompatíveis
        if: steps.base.outputs.existe == 'true'
        uses: oasdiff/oasdiff-action/breaking@9ce3a29eb0e6478dd0140932a678c7fb59d08f22 # v0.1.20
        with:
          base: contrato-base.yaml
          revision: ${{ env.CONTRATO }}
          fail-on: ERR
