# Verificação de todo PR para a main (REQ-07, specs/007-ci-demo): build com avisos como
# erros, testes unitários e de integração com Docker obrigatório, e a demonstração no ar.
# Análise estática no SonarQube Cloud (REQ-20, specs/020-sonarqube-cloud): o scanner envolve
# o build e os testes do job "Build e testes", nos PRs e no push da main. A análise da main é
# a referência de comparação dos PRs e do badge do README; no push da main, a demonstração não
# roda de novo.
# Tempo (issue #70, docs/otimizacao-ci.md): a imagem do SQL Server com Full-Text Search vem
# pronta do GHCR, e os testes de integração rodam em paralelo (xunit.runner.json).
# Vulnerabilidades das dependências (REQ-26, specs/026-dependabot-codeql): depois do restore,
# alta e crítica reprovam o job, com o resumo por pacote; o CodeQL roda em codeql.yml.
name: build-testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-testes-${{ github.ref }}
  # Nos PRs, um push novo cancela a execução anterior; na main, cada merge é analisado até o fim.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Publicar a imagem do SQL Server no GHCR quando docker/sqlserver mudar (issue #70).
      packages: write
    env:
      # Sem Docker, os testes com banco e broker reais falham em vez de serem ignorados.
      OMS_EXIGIR_DOCKER: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o Sonar identifica o código novo e a autoria das linhas.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache de pacotes NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache do SonarQube
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('.config/dotnet-tools.json') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Ferramentas locais
        run: dotnet tool restore

      # Issue #70: a imagem do SQL Server com Full-Text Search (REQ-22) vem pronta do GHCR, com
      # tag pelo hash de docker/sqlserver, e só é montada e publicada quando a pasta muda. Os
      # testes a usam por OMS_IMAGEM_SQLSERVER, sem montar nada. O logout no fim tira a
      # credencial do Docker antes dos testes, que rodam código da aplicação.
      - name: Imagem do SQL Server
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ hashFiles('docker/sqlserver/**') }}
        run: |
          imagem="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oms-sqlserver-testes:${HASH:0:16}"
          # Sem o GHCR, a imagem é montada aqui e os testes seguem: só a publicação fica para depois.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin \
            || echo "::warning::Login no GHCR falhou; a imagem do SQL Server será montada no runner."
          inicio=$(date +%s)
          if docker pull --quiet "$imagem"; then
            origem="baixada do GHCR"
          else
            docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$imagem" docker/sqlserver
            if docker push --quiet "$imagem"; then
              origem="montada e publicada no GHCR"
            else
              origem="montada no runner (publicação no GHCR falhou)"
              echo "::warning::Não foi possível publicar $imagem no GHCR."
            fi
          fi
          docker logout ghcr.io || true
          echo "OMS_IMAGEM_SQLSERVER=$imagem" >> "$GITHUB_ENV"
          echo "Imagem do SQL Server $origem em $(( $(date +%s) - inicio )) s (\`$imagem\`)." >> "$GITHUB_STEP_SUMMARY"

      # Só "true" ou "false", nunca o valor: em PRs de forks, sem acesso aos segredos, a análise
      # é pulada e build e testes rodam normalmente (REQ-20, FR-004).
      - name: Análise disponível
        id: sonar
        run: echo "ativo=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # O token fica só no env deste passo e do "Encerrar a análise", dentro de
      # SONARQUBE_SCANNER_PARAMS, que o scanner lê; nunca na linha de comando nem no env do job
      # (os testes, que rodam código da aplicação, não o veem). Parâmetros e exclusões:
      # specs/020-sonarqube-cloud/contracts/analise-no-ci.md.
      - name: Iniciar a análise
        if: steps.sonar.outputs.ativo == 'true'
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":"${{ secrets.SONAR_TOKEN }}"}'
        run: >-
          dotnet sonarscanner begin
          /k:"LucasFrenhan_Order-Management-System"
          /o:"lucasfrenhan"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.coverageReportPaths="resultados-sonar/SonarQube.xml"
          /d:sonar.cs.vstest.reportsPaths="resultados/**/*.trx"
          /d:sonar.exclusions="specs/**,.specify/**,**/Persistencia/Migracoes/**,**/obj/**,**/bin/**"
          /d:sonar.coverage.exclusions="**/Persistencia/Migracoes/**"

      - name: Restaurar
        run: dotnet restore PedidoFulfillment.sln

      # REQ-26 (FR-011 a FR-014, specs/026-dependabot-codeql): alta e crítica reprovam, salvo
      # exceção vigente em .github/vulnerabilidades-aceitas.json; baixa e moderada vão ao resumo
      # como aviso. O roteiro é conferido antes com as saídas gravadas da pasta de exemplos.
      - name: Vulnerabilidades
        shell: pwsh
        run: |
          ./.github/scripts/exemplos-vulnerabilidades/conferir.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/verificar-vulnerabilidades.ps1
          exit $LASTEXITCODE

      - name: Compilar
        run: dotnet build PedidoFulfillment.sln -c Release --no-restore

      - name: Testar
        run: >-
          dotnet test PedidoFulfillment.sln -c Release --no-build
          --logger "trx;LogFilePrefix=resultado"
          --results-directory resultados
          --collect "Code Coverage;Format=cobertura"
          --settings coverage.runsettings

      - name: Resumo dos testes
        if: always()
        run: bash .github/scripts/resumo-testes.sh resultados

      # Junta a cobertura unitária e a de integração no formato genérico do SonarQube, linha a
      # linha e com branches. O XML do Visual Studio fazia o Sonar contar só a primeira linha de
      # cada instrução em várias linhas (REQ-20, research R-05).
      - name: Converter a cobertura para o SonarQube
        if: steps.sonar.outputs.ativo == 'true'
        run: >-
          dotnet reportgenerator
          "-reports:resultados/**/*.cobertura.xml"
          "-targetdir:resultados-sonar"
          "-reporttypes:SonarQube"

      - name: Encerrar a análise
        if: steps.sonar.outputs.ativo == 'true'
        env:
          SONARQUBE_SCANNER_PARAMS: '{"sonar.token":"${{ secrets.SONAR_TOKEN }}"}'
        run: dotnet sonarscanner end

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-testes
          path: |
            resultados
            resultados-sonar
          retention-days: 14
          if-no-files-found: warn

  demo:
    name: Demonstração
    # Só nos PRs: o push da main leva o código que o PR já subiu e conferiu.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Subir a demonstração
        run: |
          inicio=$(date +%s)
          docker compose --profile demo up -d --wait --wait-timeout 300 --build
          echo "Demonstração pronta em $(( $(date +%s) - inicio )) s (com build da imagem)." >> "$GITHUB_STEP_SUMMARY"

      - name: Prontidão
        run: curl -fsS http://localhost:5230/health/pronto

      - name: Login do administrador
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d '{"email":"admin@oms.local","senha":"AdminDev2026"}' \
            http://localhost:5230/api/v1/auth/login | grep -q tokenAcesso

      - name: Prontidão do Worker
        run: curl -fsS http://localhost:5231/health/pronto

      # REQ-19: a API de pagamento simulada, que o Worker chama pela rede.
      - name: API de pagamento simulada
        run: curl -fsS http://localhost:5232/health

      - name: Registros da API
        if: failure()
        run: docker compose --profile demo logs api worker pagamentos sqlserver

      - name: Encerrar
        if: always()
        run: docker compose --profile demo down -v
