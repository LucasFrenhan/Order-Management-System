# Atualizações automáticas de dependências (REQ-26, specs/026-dependabot-codeql, research R-04;
# procedimento em docs/seguranca-cadeia-build.md).
#
# - Semanal, na segunda de manhã, com no máximo 5 PRs abertos por ecossistema (10 no NuGet).
# - Regra das duas semanas: o cooldown só propõe versões publicadas há 14 dias ou mais. As
#   atualizações de segurança não esperam (o cooldown não vale para elas).
# - Minor e patch em grupos por família; major em PR próprio, para ser avaliado à parte.
# - Commits "build(deps): ..." e "ci(deps): ..." sem ID de requisito (constituição 1.1.1).
# - Os PRs passam pelas mesmas verificações exigidas de qualquer PR e só entram por rebase,
#   depois que o dono revisa e liga o auto-merge.
version: 2

updates:
  - package-ecosystem: nuget
    # Lê o Directory.Packages.props e as ferramentas locais de .config/dotnet-tools.json.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    # 10, não 5: os majors ficam abertos enquanto são avaliados à parte e, com 5, ocupavam as
    # vagas dos grupos (em 2026-11-08, 4 majors e o grupo dotnet travaram os outros três).
    open-pull-requests-limit: 10
    # Escopo fixo no prefixo: com "include: scope", os grupos que misturam pacotes de produção e
    # de desenvolvimento saíam "build: ..." sem o "(deps)" (PRs #87 e #88). O Dependabot põe os
    # dois-pontos depois do parêntese.
    commit-message:
      prefix: build(deps)
    # Uma dependência que casa com mais de um grupo entra em todos: o "demais" exclui os padrões
    # dos outros grupos (sem isso, o PR dele substituía os outros, como o #91 fez com #87–#89).
    groups:
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Logging.*"
          - "Microsoft.Data.SqlClient"
          - "System.*"
          - "dotnet-ef"
        update-types: [minor, patch]
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
        update-types: [minor, patch]
      testes:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "FluentAssertions"
          - "Testcontainers*"
          - "JsonSchema.Net"
          - "Microsoft.OpenApi.YamlReader"
        update-types: [minor, patch]
      ferramentas:
        patterns:
          - "dotnet-sonarscanner"
          - "dotnet-reportgenerator-globaltool"
        update-types: [minor, patch]
      demais:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.Logging.*"
          - "Microsoft.Data.SqlClient"
          - "System.*"
          - "dotnet-ef"
          - "OpenTelemetry*"
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "FluentAssertions"
          - "Testcontainers*"
          - "JsonSchema.Net"
          - "Microsoft.OpenApi.YamlReader"
          - "dotnet-sonarscanner"
          - "dotnet-reportgenerator-globaltool"
        update-types: [minor, patch]
    ignore:
      # A partir da 8 a licença é comercial; o projeto fixa a série 7.x (Directory.Packages.props).
      - dependency-name: "FluentAssertions"
        versions: [">=8.0.0"]
      # A 3 exige o Microsoft.OpenApi 3, e o Microsoft.AspNetCore.OpenApi 10.0.x só aceita abaixo
      # de 3.0 (NU1608 no restore, PR #93). Tirar quando o ASP.NET Core migrar para o OpenApi 3.
      - dependency-name: "Microsoft.OpenApi.YamlReader"
        versions: [">=3.0.0"]

  - package-ecosystem: github-actions
    # Troca o SHA fixado e o comentário "# vX.Y.Z" juntos.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /docker/sqlserver
      - /src/PedidoFulfillment.API
      - /src/PedidoFulfillment.Worker
      - /src/PedidoFulfillment.PagamentosSimulados
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      imagens:
        patterns:
          - "*"
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    # Os testes de integração leem as imagens daqui (FR-019): um PR atualiza os dois.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      compose:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      # Imagem montada pelo projeto a partir de docker/sqlserver; não existe em registro.
      - dependency-name: "oms-sqlserver"
