# Ambiente local do OMS (REQ-02): dependências da API em contêineres; a API roda pelo SDK.
# O perfil "demo" (REQ-07) sobe também a API e o Worker (REQ-06) em contêiner, sem o SDK.
# Credenciais SOMENTE DE DESENVOLVIMENTO, válidas só para estes contêineres locais.
# Portas e credenciais podem ser trocadas por variáveis OMS_* (veja .env.example).
# Versões das imagens fixas, sem "latest"; atualizar de forma manual e deliberada.
#
#   docker compose up -d --wait                       sobe e espera banco e broker
#   docker compose --profile demo up -d --wait --build  sobe banco, broker, API e Worker
#   docker compose down                               para (os dados continuam nos volumes)
#   docker compose --profile demo down -v             para tudo e apaga os dados locais

name: oms

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${OMS_SQL_SENHA:-OmsDev_2026!Local}
    ports:
      - "${OMS_SQL_PORTA:-1433}:1433"
    volumes:
      - oms-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      retries: 12
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: ${OMS_RABBITMQ_USUARIO:-oms}
      RABBITMQ_DEFAULT_PASS: ${OMS_RABBITMQ_SENHA:-oms-dev-local}
    ports:
      - "${OMS_RABBITMQ_PORTA:-5672}:5672"
      - "${OMS_RABBITMQ_PORTA_PAINEL:-15672}:15672"
    volumes:
      - oms-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 12
      start_period: 20s

  # Só no perfil demo (REQ-07, research R-09): a API em Development aplica as migrations e
  # cria perfis, usuários iniciais e catálogo; dentro da rede usa as portas internas.
  api:
    profiles: [demo]
    build:
      context: .
      dockerfile: src/PedidoFulfillment.API/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=PedidoFulfillment;User Id=sa;Password=${OMS_SQL_SENHA:-OmsDev_2026!Local};Encrypt=True;TrustServerCertificate=True
      RabbitMQ__Servidor: rabbitmq
      RabbitMQ__Porta: "5672"
      RabbitMQ__Usuario: ${OMS_RABBITMQ_USUARIO:-oms}
      RabbitMQ__Senha: ${OMS_RABBITMQ_SENHA:-oms-dev-local}
    ports:
      - "${OMS_API_PORTA:-5230}:8080"
    healthcheck:
      # A imagem aspnet não tem curl; bash com /dev/tcp faz o GET da prontidão (R-08).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/pronto HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Só no perfil demo (REQ-06, research R-10): consumidores e despachante do outbox. Sobe depois
  # da API, que cria as tabelas; as mesmas conexões, e só expõe /health e /health/pronto.
  worker:
    profiles: [demo]
    build:
      context: .
      dockerfile: src/PedidoFulfillment.Worker/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: Server=sqlserver,1433;Database=PedidoFulfillment;User Id=sa;Password=${OMS_SQL_SENHA:-OmsDev_2026!Local};Encrypt=True;TrustServerCertificate=True
      RabbitMQ__Servidor: rabbitmq
      RabbitMQ__Porta: "5672"
      RabbitMQ__Usuario: ${OMS_RABBITMQ_USUARIO:-oms}
      RabbitMQ__Senha: ${OMS_RABBITMQ_SENHA:-oms-dev-local}
    ports:
      - "${OMS_WORKER_PORTA:-5231}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/pronto HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  oms-sqlserver:
  oms-rabbitmq:
